# P0-1: required CI for compass-health.
# Python matrix + full pytest (BFF contract, voice with real WebM fixtures,
# legacy-write gate) against a real PostgreSQL for the domain side.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U compass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://compass:compass@localhost:5433/compass_health
      SECRET_KEY: ci-only-secret-key-min-32-chars-0a1b2c3d4e5f
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # passlib 1.7.4 is incompatible with bcrypt>=4.1; keep the pin explicit.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "bcrypt==4.0.1" pytest pytest-asyncio

      - name: Run test suite
        working-directory: backend
        run: pytest tests -q
